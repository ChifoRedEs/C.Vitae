<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Generador de CV</title>
  <meta name="description" content="Crea, diseña y exporta currículums en PDF y Word desde el navegador.">
  <meta name="theme-color" content="#16302f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6f6b'/%3E%3Crect x='8' y='6' width='16' height='20' rx='2' fill='%23fff'/%3E%3Crect x='8' y='6' width='6' height='20' fill='%23bfe0dc'/%3E%3Crect x='16' y='10' width='6' height='2' fill='%232f6f6b'/%3E%3Crect x='16' y='14' width='6' height='1.5' fill='%2399a'/%3E%3Crect x='16' y='17' width='5' height='1.5' fill='%2399a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=Lato:wght@400;700&family=Work+Sans:wght@400;600;700&family=Open+Sans:wght@400;600;700&family=Roboto:wght@400;500;700&family=Montserrat:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Merriweather:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/cv.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <a class="brand" href="#cvs" aria-label="Generador de CV, ir a Mis CV">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Generador de CV</span>
      </a>
      <button class="cv-chip" id="cvChip" type="button" title="Cambiar el nombre de este CV"></button>
      <div class="top-actions">
        <button class="btn primary" id="btnPdfTop" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M5 21h14"/></svg><span>Descargar PDF</span>
        </button>
        <a class="user-chip" id="userChip" href="#perfil" aria-label="Mi perfil"></a>
      </div>
    </header>

    <nav class="nav" id="nav" aria-label="Secciones de la app">
      <a href="#cvs" data-view="cvs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg><span>Mis CV</span></a>
      <a href="#editor" data-view="editor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/></svg><span>Editor</span></a>
      <a href="#diseno" data-view="diseno"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.3A4.7 4.7 0 0 0 21 9.7C21 6 17 3 12 3z"/><circle cx="7.5" cy="11.5" r="1.3"/><circle cx="10.5" cy="7.5" r="1.3"/><circle cx="15" cy="7.5" r="1.3"/></svg><span>Diseño</span></a>
      <a href="#exportar" data-view="exportar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M5 21h14"/></svg><span>Exportar</span></a>
      <a href="#perfil" data-view="perfil"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Mi perfil</span></a>
    </nav>

    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <div id="print-root" aria-hidden="true"></div>
  <div id="modal-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="fileJson" accept=".json,application/json" hidden>
  <input type="file" id="fileFoto" accept="image/*" hidden>

  <script src="js/store.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/docx.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
